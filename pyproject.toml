[project]
name = "minionerec-lite"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
 "torch==2.6.0", "transformers==4.57.1", "trl==0.24.0", "peft==0.18.1",
 "accelerate==1.10.1", "datasets==4.2.0", "fire==0.7.1", "numpy==1.26.4",
 "pandas==2.2.2", "pyarrow==21.0.0", "scikit-learn==1.6.1", "tqdm==4.67.1", "wandb==0.22.2", "protobuf>=5,<7",
]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'", "sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
